#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "diagnostickoeur"
name = "DiagnoStickœur"

maintainers = ["Tagada"]

description.en = "Print sticker labels!"
description.fr = "Imprimer des stickers !"

version = "2026.05.18~ynh1"

[upstream]
license = "GPL-3.0-or-later"

code = "https://framagit.org/stickoeur/diagnostickoeur"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = false

ldap = "not_relevant"
sso = "not_relevant"

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources.main]
    url = "https://framagit.org/stickoeur/diagnostickoeur/-/archive/7dbd77119f6d1545dcfc6ec11eff07ce5dc02c43/diagnostickoeur-7dbd77119f6d1545dcfc6ec11eff07ce5dc02c43.tar.bz2"
    sha256 = "5a8f9eafbcd4117bd6238d5a3d333a4eb939e7e70333785f47c61032d6120be9"

    autoupdate.strategy = "latest_gitlab_commit"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "python3, python3-pip, python3-venv"
